name: CI 
  
on: 
  pull_request: 
    branches: [main] 
  push: 
    branches: [main] 
  workflow_call: 
  
permissions: 
  contents: read 
  
jobs: 
  testes: 
    name: testes 
    runs-on: ubuntu-latest 
    steps: 
      - name: Obter o código do repositório 
        uses: actions/checkout@v5 
  
      - name: Instalar Python 3.12 
        uses: actions/setup-python@v6 
        with: 
          python-version: "3.12" 
          cache: pip 
  
      - name: Instalar dependências 
        run: | 
          python -m pip install --upgrade pip 
          pip install -r requirements-dev.txt 
  
      - name: Verificar estilo e erros (ruff) 
        run: ruff check . 
  
      - name: Correr testes com cobertura (pytest) 
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=90 