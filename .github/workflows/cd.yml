name: CD 
  
on: 
  push: 
    tags: ["v*.*.*"] 
  
permissions: 
  contents: write 
  packages: write 
  
jobs: 
  testes: 
    uses: ./.github/workflows/ci.yml 
  
  publicar: 
    needs: testes 
    runs-on: ubuntu-latest 
    steps: 
      - name: Obter o código do repositório 
        uses: actions/checkout@v5 
  
      - name: Autenticar no GitHub Container Registry 
        uses: docker/login-action@v3 
        with: 
          registry: ghcr.io 
          username: ${{ github.actor }} 
          password: ${{ secrets.GITHUB_TOKEN }} 
  
      - name: Calcular o nome da imagem (em minúsculas) 
        id: meta 
        run: echo "imagem=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT" 
  
      - name: Construir e publicar a imagem Docker 
        uses: docker/build-push-action@v6 
        with: 
          context: . 
          push: true 
          tags: | 
            ${{ steps.meta.outputs.imagem }}:${{ github.ref_name }} 
            ${{ steps.meta.outputs.imagem }}:latest 
  
      - name: Criar a GitHub Release 
        env: 
          GH_TOKEN: ${{ github.token }} 
        run: | 
          gh release create "${{ github.ref_name }}" \ 
            --title "Calculadora ${{ github.ref_name }}" \ 
            --generate-notes 